name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: pwsh
        run: |
          $goFiles = @(Get-ChildItem -Recurse -File -Filter '*.go' | Select-Object -ExpandProperty FullName)
          $unformatted = @($goFiles | ForEach-Object { gofmt -l $_ })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Error
            exit 1
          }

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Vet
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/0disoft/krasis/internal/wininput' })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($packages.Count -gt 0) {
            go vet @packages
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          go vet -unsafeptr=false ./internal/wininput

      - name: Build probe binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -o build/krasis-lab.exe ./cmd/krasis-lab
          go build -trimpath -o build/krasis-launcher.exe ./cmd/krasis-launcher

      - name: Package and verify device probe kit
        shell: pwsh
        run: |
          $packageArguments = @{
            Commit = '${{ github.sha }}'
            Repository = '${{ github.repository }}'
            WorkflowRun = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          $packagePath = ./scripts/package-probe-kit.ps1 @packageArguments
          $firstHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash

          $reusedPath = ./scripts/package-probe-kit.ps1 @packageArguments
          $secondHash = (Get-FileHash -LiteralPath $reusedPath -Algorithm SHA256).Hash
          if ($reusedPath -ne $packagePath -or $secondHash -ne $firstHash) {
            throw 'A same-revision rerun did not reuse the byte-identical package.'
          }

          $mismatchedArguments = $packageArguments.Clone()
          $mismatchedArguments.WorkflowRun = $packageArguments.WorkflowRun + '/mismatched-build'
          $mismatchRejected = $false
          try {
            ./scripts/package-probe-kit.ps1 @mismatchedArguments -OutputPath $packagePath | Out-Null
          }
          catch {
            $mismatchRejected = $true
          }
          if (-not $mismatchRejected) {
            throw 'Packaging accepted a mismatched existing artifact.'
          }

      - name: Upload probe kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krasis-probe-kit-windows-amd64-${{ github.sha }}
          path: dist/krasis-probe-kit-windows-amd64-${{ github.sha }}.zip
          if-no-files-found: error
