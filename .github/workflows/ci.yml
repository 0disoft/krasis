name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: pwsh
        run: |
          $goFiles = @(Get-ChildItem -Recurse -File -Filter '*.go' | Select-Object -ExpandProperty FullName)
          $unformatted = @($goFiles | ForEach-Object { gofmt -l $_ })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Error
            exit 1
          }

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Vet
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/0disoft/krasis/internal/wininput' })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($packages.Count -gt 0) {
            go vet @packages
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          go vet -unsafeptr=false ./internal/wininput

      - name: Build probe binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -o build/krasis-lab.exe ./cmd/krasis-lab
          go build -trimpath -o build/krasis-launcher.exe ./cmd/krasis-launcher

      - name: Package device probe kit
        shell: pwsh
        run: |
          $packageArguments = @{
            Commit = '${{ github.sha }}'
            Repository = '${{ github.repository }}'
            WorkflowRun = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          ./scripts/package-probe-kit.ps1 @packageArguments

      - name: Upload lab CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krasis-probe-kit-windows-amd64-${{ github.sha }}
          path: dist/krasis-probe-kit-windows-amd64.zip
          if-no-files-found: error
