name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select verified runtime toolchain
        id: runtime-toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content scripts/runtime/stw-retake.json -Raw | ConvertFrom-Json
          $version = [regex]::Match($manifest.toolchain, '^go(1\.\d+\.\d+)$')
          if (-not $version.Success) { throw 'Invalid verified runtime toolchain' }
          "version=$($version.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.runtime-toolchain.outputs.version }}
          check-latest: false
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Prepare and verify temporary Go runtime backport
        shell: pwsh
        run: |
          node --test scripts/runtime-stw-overlay.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeOverlay = node scripts/runtime-stw-overlay.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GOFLAGS=$($runtimeOverlay.GOFLAGS)" >> $env:GITHUB_ENV

      - name: Test and build native frontend
        shell: pwsh
        run: |
          npm.cmd --prefix frontend ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build -- --mode native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting
        shell: pwsh
        run: |
          $goFiles = @(Get-ChildItem -Recurse -File -Filter '*.go' | Select-Object -ExpandProperty FullName)
          $unformatted = @($goFiles | ForEach-Object { gofmt -l $_ })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Error
            exit 1
          }

      - name: Test
        shell: pwsh
        # Bound contention between packages that spawn PowerShell/COM helpers.
        # Keep the same job and test coverage without replaying OS mutations.
        run: go test -p 2 -timeout 3m ./...

      - name: Vet
        shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/0disoft/krasis/internal/wininput' })
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($packages.Count -gt 0) {
            go vet @packages
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          go vet -unsafeptr=false ./internal/wininput

      - name: Build Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -o build/krasis-cli.exe ./cmd/krasis-cli
          go build -trimpath -o build/krasis-agent.exe ./cmd/krasis-agent
          go build -trimpath -o build/krasis-lab.exe ./cmd/krasis-lab
          go build -trimpath -o build/krasis-launcher.exe ./cmd/krasis-launcher

      - name: Test and build desktop product
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test -tags desktop -timeout 3m ./internal/workspacehost ./cmd/krasis ./cmd/krasis-control ./cmd/krasis-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags desktop,production -trimpath -o build/ ./cmd/krasis ./cmd/krasis-control ./cmd/krasis-workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify device probe kit
        shell: pwsh
        run: |
          $packageArguments = @{
            Commit = '${{ github.sha }}'
            Repository = '${{ github.repository }}'
            WorkflowRun = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          $packagePath = ./scripts/package-probe-kit.ps1 @packageArguments
          $firstHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash

          $reusedPath = ./scripts/package-probe-kit.ps1 @packageArguments
          $secondHash = (Get-FileHash -LiteralPath $reusedPath -Algorithm SHA256).Hash
          if ($reusedPath -ne $packagePath -or $secondHash -ne $firstHash) {
            throw 'A same-revision rerun did not reuse the byte-identical package.'
          }

          $mismatchedArguments = $packageArguments.Clone()
          $mismatchedArguments.WorkflowRun = $packageArguments.WorkflowRun + '/mismatched-build'
          $mismatchRejected = $false
          try {
            ./scripts/package-probe-kit.ps1 @mismatchedArguments -OutputPath $packagePath | Out-Null
          }
          catch {
            $mismatchRejected = $true
          }
          if (-not $mismatchRejected) {
            throw 'Packaging accepted a mismatched existing artifact.'
          }

      - name: Upload probe kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krasis-probe-kit-windows-amd64-${{ github.sha }}
          path: dist/krasis-probe-kit-windows-amd64-${{ github.sha }}.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select verified runtime toolchain
        id: runtime-toolchain
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import json, re
          with open('scripts/runtime/stw-retake.json') as source:
              toolchain = json.load(source)['toolchain']
          if not re.fullmatch(r'go1\.\d+\.\d+', toolchain):
              raise SystemExit('Invalid verified runtime toolchain')
          print(toolchain[2:])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.runtime-toolchain.outputs.version }}
          check-latest: false
          cache: false

      - name: Install isolated X11 test dependencies
        run: bash scripts/install-linux-ci-x11-deps.sh

      - name: Test Linux packages
        run: go test -p 2 -count=1 -timeout 3m ./...

      - name: Vet Linux packages
        run: go vet ./...

      - name: Prepare disposable PAM and logind test users
        run: |
          sudo systemctl start systemd-logind
          systemctl is-active --quiet systemd-logind
          test ! -e /etc/pam.d/krasis-ci
          # A graphical PAM session, without modifying the host login stack.
          # Authentication remains denied; only root can launch the test units.
          sudo tee /etc/pam.d/krasis-ci > /dev/null <<'PAM'
          auth required pam_deny.so
          account required pam_unix.so
          session required pam_systemd.so class=user type=x11
          PAM
          for user in krasis-ci-a krasis-ci-b; do
            if getent passwd "$user" > /dev/null; then
              echo "Refusing to reuse an existing user: $user" >&2
              exit 1
            fi
            sudo useradd --create-home --shell /bin/bash --no-log-init "$user"
          done

      - name: Test X11 input, clipboard and authenticated handoffs
        env:
          KRASIS_X11_ACTUAL_LIFECYCLE: '1'
          KRASIS_X11_TEST_LOCAL_USER: krasis-ci-a
          KRASIS_X11_TEST_PEER_USER: krasis-ci-b
          KRASIS_X11_TEST_PAM_SERVICE: krasis-ci
        run: bash scripts/test-linux-x11.sh

      - name: Build Linux bundle
        run: sh scripts/build-linux.sh
