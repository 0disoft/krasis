name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved generation tag, e.g. g184
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: krasis-release
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      KRASIS_RELEASE_PUBLIC_KEY: ${{ vars.KRASIS_RELEASE_PUBLIC_KEY }}
      KRASIS_SIGN_CERT_THUMBPRINT: ${{ vars.KRASIS_SIGN_CERT_THUMBPRINT }}
      KRASIS_SIGN_TIMESTAMP_URL: ${{ vars.KRASIS_SIGN_TIMESTAMP_URL }}
      KRASIS_SIGN_CERT_PASSWORD: ${{ secrets.KRASIS_SIGN_CERT_PASSWORD }}
    steps:
      - name: Checkout approved tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Select verified runtime toolchain
        id: runtime-toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content scripts/runtime/stw-retake.json -Raw | ConvertFrom-Json
          $version = [regex]::Match($manifest.toolchain, '^go(1\.\d+\.\d+)$')
          if (-not $version.Success) { throw 'Invalid verified runtime toolchain' }
          "version=$($version.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.runtime-toolchain.outputs.version }}
          check-latest: false
          cache: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate release and prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^g[1-9][0-9]*$') { throw 'Expected a generation tag' }
          $generation = [regex]::Match((Get-Content internal/localapi/runtime.go -Raw), 'const AgentGeneration = ([0-9]+)').Groups[1].Value
          if ($env:RELEASE_TAG -ne "g$generation") { throw 'Tag and source generation differ' }
          if ([string]::IsNullOrWhiteSpace($env:KRASIS_RELEASE_PUBLIC_KEY)) { throw 'Release public key is not configured' }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\llvm-rc.exe") -or !(Test-Path "$llvm\llvm-cvtres.exe")) { throw 'LLVM resource tools unavailable' }
          "KRASIS_LLVM_BIN=$llvm" >> $env:GITHUB_ENV
          $env:GOMODCACHE = Join-Path (Get-Location) '.cache/go-mod'
          go mod download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify and build release folder
        shell: pwsh
        env:
          KRASIS_SIGN_CERT_BASE64: ${{ secrets.KRASIS_SIGN_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KRASIS_SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:KRASIS_SIGN_CERT_THUMBPRINT) -or [string]::IsNullOrWhiteSpace($env:KRASIS_SIGN_TIMESTAMP_URL)) { throw 'Publisher signing identity is not configured' }
          $krasisCertFile = Join-Path $env:RUNNER_TEMP 'krasis-release.pfx'
          [IO.File]::WriteAllBytes($krasisCertFile,[Convert]::FromBase64String($env:KRASIS_SIGN_CERT_BASE64))
          $env:KRASIS_SIGN_CERT_FILE = $krasisCertFile
          "KRASIS_SIGN_CERT_FILE=$krasisCertFile" >> $env:GITHUB_ENV
          $env:GOMODCACHE = Join-Path (Get-Location) '.cache/go-mod'
          $env:GOCACHE = Join-Path (Get-Location) '.cache/go-build'
          $env:GOPROXY = 'off'
          go test -timeout 90s ./internal/appinstall ./cmd/krasis-setup ./internal/appsettings ./internal/releaseupdate ./internal/productpanel ./internal/launchrecord ./internal/productcli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build-workspace.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/build-app-setup.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign immutable update feed
        shell: pwsh
        env:
          KRASIS_RELEASE_PRIVATE_KEY: ${{ secrets.KRASIS_RELEASE_PRIVATE_KEY }}
        run: |
          node scripts/sign-release.mjs "dist/workspace/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist/releases/$env:RELEASE_TAG/krasis-$env:RELEASE_TAG-windows-amd64.zip"
          $feed = "dist/releases/$env:RELEASE_TAG/latest.json"
          $setup = "dist/app-setup/$env:RELEASE_TAG/KrasisSetup-$env:RELEASE_TAG.exe"
          $setupHashes = "dist/app-setup/$env:RELEASE_TAG/SHA256SUMS.txt"
          gh release create $env:RELEASE_TAG $archive $feed $setup $setupHashes --verify-tag --title "Krasis $env:RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Remove ephemeral signing identity
        if: always()
        shell: pwsh
        run: |
          $krasisCertFile = Join-Path $env:RUNNER_TEMP 'krasis-release.pfx'
          if (Test-Path -LiteralPath $krasisCertFile) { Remove-Item -LiteralPath $krasisCertFile -Force }
